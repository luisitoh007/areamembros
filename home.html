<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlackMind Academy - Módulos</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <nav class="nav-bar">
    <div class="logo">BlackMind Academy</div>
    <button onclick="logout()" class="btn-logout">Sair</button>
  </nav>

  <main class="modules-container">
    <h1>Seus Módulos</h1>

    <section class="module-row">
      <h2>Módulos Principais</h2> <div class="carousel-container">
        <button class="carousel-btn prev" data-row="1">‹</button>
        <div class="viewport" id="viewport-1">
          <div class="cards-grid" id="cards-row-1">
            </div>
        </div>
        <button class="carousel-btn next" data-row="1">›</button>
      </div>
    </section>

    <section class="module-row">
      <h2>Módulos Avançados</h2>
      <div class="carousel-container">
        <button class="carousel-btn prev" data-row="2">‹</button>
        <div class="viewport" id="viewport-2">
          <div class="cards-grid" id="cards-row-2">
            </div>
        </div>
        <button class="carousel-btn next" data-row="2">›</button>
      </div>
    </section>

    <section class="module-row">
      <h2>Módulos Bônus</h2>
      <div class="carousel-container">
        <button class="carousel-btn prev" data-row="3">‹</button>
        <div class="viewport" id="viewport-3"><!-- Novo ID -->
          <div class="cards-grid" id="cards-row-3"><!-- Novo ID -->
            </div>
        </div>
        <button class="carousel-btn next" data-row="3">›</button>
      </div>
    </section>
  </main>

  <div id="module-detail-overlay" class="module-detail hidden"><!-- Renomeado para clareza -->
    <button class="back-btn" onclick="closeModuleDetail()">← Voltar</button>
    <h2 id="detail-title"></h2>
    <div class="progress-bar">
      <div id="detail-progress-fill" class="progress-fill"></div>
    </div>
    <ul id="detail-lesson-list" class="lesson-list"></ul>
  </div>

  <script>
    // Configuração do Firebase (deve ser a primeira coisa)
    const firebaseConfig = { 
      apiKey: "AIzaSyBdndbvlBYTNY9pOdskuxYZFMtK1B84Q7U", // Mantenha sua chave segura
      authDomain: "black-mind-d6547.firebaseapp.com", 
      projectId: "black-mind-d6547" 
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore(); // Instância do Firestore

    // Protege a página e inicializa o conteúdo
    auth.onAuthStateChanged(async user => {
      if (user) {
        await loadHomePageContent(user);
      } else {
        window.location.href = 'index.html';
      }
    });

    function logout() {
      auth.signOut().then(() => {
        window.location.href = 'index.html';
      });
    }

    async function loadHomePageContent(user) {
      try {
        // Fetch modules definitions from Firestore
        const modulesCol = db.collection('modules');
        const modulesSnapshot = await modulesCol.get();
        const allModules = modulesSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

        // Fetch user progress
        const userProgRef = db.collection('userProgress').doc(user.uid);
        const userProgSnap = await userProgRef.get();
        const userModulesProgress = userProgSnap.exists ? (userProgSnap.data().modules || {}) : {};

        // Define a distribuição de módulos por linha (ex: 4-3-3 para 10 módulos)
        // Ajuste conforme o número de módulos que você tiver ou como quiser exibi-los
          const modulesDistribution = [
          { rowId: 'cards-row-1', count: 4, modules: [] },
          { rowId: 'cards-row-2', count: 3, modules: [] },
          { rowId: 'cards-row-3', count: 3, modules: [] }
        ];
        
        let moduleIndex = 0;
        for (const dist of modulesDistribution) {
            for (let i = 0; i < dist.count && moduleIndex < allModules.length; i++) {
                dist.modules.push(allModules[moduleIndex++]);
            }
        }

        modulesDistribution.forEach(distEntry => {
            const container = document.getElementById(distEntry.rowId);
            container.innerHTML = ''; // Limpa antes de adicionar
            distEntry.modules.forEach(mod => {
                const completedLessons = (userModulesProgress[mod.id]?.completedLessons) || [];
                const totalLessons = Array.isArray(mod.lessons) ? mod.lessons.length : 0;
                const percentComplete = totalLessons > 0 ? Math.round((completedLessons.length / totalLessons) * 100) : 0;

                addCardToDOM(mod, percentComplete, container, userModulesProgress);
            });
        });

      } catch (error) {
        console.error("Erro ao carregar módulos ou progresso:", error);
        alert("Não foi possível carregar os módulos. Tente novamente mais tarde.");
      }
    }

    function addCardToDOM(moduleData, percentComplete, containerElement, progressData) {
      const card = document.createElement('div');
      card.className = 'card'; // Usando a classe 'card' do seu style.css
      // A thumbnail pode vir do seu Firestore (moduleData.thumbUrl ou similar)
      // Se não tiver, pode usar um placeholder ou cor/ícone padrão.
      const thumbUrl = moduleData.thumbUrl || `https://via.placeholder.com/300x200?text=${encodeURIComponent(moduleData.title)}`;
      
      card.innerHTML = `
        <img src='${thumbUrl}' alt='Thumbnail ${moduleData.title}'/>
        <div class='card-info'>
          <span class='module-label'>Módulo ${moduleData.id}</span>
          <h2>${moduleData.title}</h2>
          <div class="progress-bar" style="height: 8px; background-color: #555; border-radius: 4px; margin-top: 10px;">
            <div class="fill" style="width: ${percentComplete}%; height: 100%; background-color: #00bfff; border-radius: 4px;"></div>
          </div>
          <p style="font-size: 0.8em; text-align: right;">${percentComplete}% completo</p>
        </div>
      `;
      card.onclick = () => openModuleDetail(moduleData.id, moduleData.title, progressData);
      containerElement.appendChild(card);
    }
    
    document.addEventListener('DOMContentLoaded', () => {
      // Configuração dos botões do carrossel
      document.querySelectorAll('.carousel-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const rowNum = btn.dataset.row;
          const viewport = document.getElementById(`viewport-${rowNum}`);
          // Para o cálculo do shift, idealmente pegamos a largura de um card + gap
          // Se os cards são flex: 0 0 32%, 3 cards ocupam ~96% + gaps.
          // Um scroll de 1/3 da viewport pode funcionar bem.
          const cardWidth = viewport.querySelector('.card')?.offsetWidth || 0;
          const gap = 20; // Do seu CSS .cards-grid { gap: 20px; }
          const scrollAmount = cardWidth + gap; // Rola um card por vez

          if (btn.classList.contains('next')) {
            viewport.scrollBy({ left: scrollAmount, behavior: 'smooth' });
          } else {
            viewport.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
          }
        });
      });
    });

    async function openModuleDetail(moduleId, moduleTitle, userProgress) { // Adicionado userProgress
        const moduleDetailOverlay = document.getElementById('module-detail-overlay');
        const titleEl = document.getElementById('detail-title');
        const lessonListEl = document.getElementById('detail-lesson-list');
        const progressFillEl = document.getElementById('detail-progress-fill');

        titleEl.textContent = moduleTitle;
        lessonListEl.innerHTML = ''; // Limpa lista anterior

        try {
            const modDoc = await db.collection('modules').doc(moduleId).get();
            if (!modDoc.exists) {
                console.error("Módulo não encontrado no Firestore:", moduleId);
                alert("Detalhes do módulo não encontrados.");
                return;
            }
            const moduleData = modDoc.data();
            const lessons = Array.isArray(moduleData.lessons) ? moduleData.lessons : [];
            
            // Calcula progresso para a barra de progresso do overlay
            const completedLessons = (userProgress[moduleId]?.completedLessons) || [];
            const totalLessons = lessons.length;
            const percentComplete = totalLessons > 0 ? Math.round((completedLessons.length / totalLessons) * 100) : 0;
            progressFillEl.style.width = `${percentComplete}%`;

            if (lessons.length > 0) {
                lessons.forEach((lesson, index) => {
                    const li = document.createElement('li');
                    li.textContent = lesson.title;
                    // Adicionar um ícone ou marcação se a aula estiver completa
                    if (completedLessons.includes(index)) {
                        li.innerHTML += " <span style='color: #00bfff;'>✔</span>"; // Exemplo de marcação
                    }
                    li.addEventListener('click', () => {
                        window.location.href = `lesson.html?mod=${moduleId}&lesson=${index}`;
                    });
                    lessonListEl.appendChild(li);
                });
            } else {
                lessonListEl.innerHTML = '<li>Nenhuma aula disponível neste módulo.</li>';
            }
            moduleDetailOverlay.classList.remove('hidden');
        } catch (error) {
            console.error("Erro ao abrir detalhes do módulo:", error);
            alert("Erro ao carregar detalhes do módulo.");
        }
    }

    function closeModuleDetail() {
      document.getElementById('module-detail-overlay').classList.add('hidden');
    }
  </script>
</body>
</html>
